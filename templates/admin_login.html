<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | Maple Growth Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container admin-container">
        <header class="header">
            <div class="logo-area">
                <h1 class="logo">Maple Growth Tracker</h1>
                <p class="subtitle">관리자 전용 로그 조회</p>
            </div>
        </header>
        <section class="admin-card">
            <h2 class="section-title">관리자 로그인</h2>
            {% if not configured %}
                <p class="error-message admin-notice">관리자 인증 환경변수가 설정되지 않았습니다. 서버 환경변수를 설정한 뒤 다시 시도해주세요.</p>
            {% endif %}
            {% if error %}
                <p class="error-message admin-notice">{{ error }}</p>
            {% endif %}
            <form method="post" class="admin-login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="username">관리자 아이디</label>
                <input id="username" name="username" type="text" class="search-input" autocomplete="username" required>
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" class="search-input" autocomplete="current-password" required>
                <button type="submit" class="search-button">로그인</button>
            </form>
            <a class="admin-back-link" href="{{ url_for('home') }}">서비스로 돌아가기</a>
        </section>
    </main>
</body>
</html>
