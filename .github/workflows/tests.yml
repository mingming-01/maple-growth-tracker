name: Tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "perf/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maple_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maple_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/maple_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Build React preview
        run: npm --prefix frontend run build

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: node --check static/app.js && node --check static/js/api.js && node --check static/js/growth.js && node --check static/js/character-details.js

      - name: Run growth metric unit tests
        run: npm run test:growth