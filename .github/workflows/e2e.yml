name: Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/e2e.yml"
      - "frontend/**"
      - "tracker/controller/page_controller.py"
      - "tracker/controller/page_controller.py"
      - "tests/test_react_root_route.py"
      - "templates/admin_login.html"
      - "templates/admin_logs.html"
      - "static/style.css"
      - "e2e/**"
      - "playwright.config.cjs"

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund

      - name: Build React preview
        run: npm --prefix frontend run build

      - name: Install Playwright
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser E2E tests
        run: npx playwright test